                      # #
      
                      TELNET_LIST=$(
                          curl --location "${BL_THREATS_API_URL}/Telnet" \
                              --header "$BL_THREATS_API_ID_NAME: $BL_THREATS_API_ID_VALUE" \
                              --header "$BL_THREATS_API_KEY_NAME: $BL_THREATS_API_KEY_VALUE" \
